[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pmlytics-ai"
version = "0.1.0"
description = "PMLytics AI - evidence-grounded product investigation and decision support"
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres>=3.0.0,<4.0.0",
    "langchain-core>=1.6.0,<2.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "PyJWT[crypto]>=2.10.0,<3.0.0",
    "SQLAlchemy[asyncio]>=2.0.36,<3.0.0",
    "psycopg[binary,pool]>=3.2.3,<4.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "alembic>=1.14.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "respx>=0.21.0",
]



[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]
extend-exclude = ["docs", "mocks/zendesk/upstream"]


[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # Formatted lines / string literals
    "B008", # FastAPI's documented dependency-injection pattern uses Depends defaults
]

[tool.ruff.lint.per-file-ignores]
"scripts/audit_phase12_calls.py" = ["E402"]
"scripts/run_phase12_empirical_validation.py" = ["E402"]
"scripts/run_phase12a_empirical_validation.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
explicit_package_bases = true
exclude = ["^mocks/zendesk/upstream/"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
